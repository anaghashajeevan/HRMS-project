server {
    listen 80;
    server_name _;

    # Tailscale Serve terminates TLS on :9001 before forwarding here. Proxy to
    # the NexusONE portal so /hrms/ remains SSO-protected while the HRMS
    # frontend itself stays off the host network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nexus_portal sso-portal-frontend-1:7000;

    location / {
        proxy_pass http://$nexus_portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
