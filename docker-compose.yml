# ==============================================================================
# HRMS Full Stack — Docker Compose
# Services: Redis, Django Backend, React Frontend, Celery Worker & Beat
# ==============================================================================

services:

  # ---------- Redis (Celery Broker + Cache) ----------
  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms_network

  # ---------- Django Backend ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - hrms_network

  # ---------- Celery Worker (Background Tasks) ----------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A HRMS worker --loglevel=info --concurrency=4
    volumes:
      - backend_logs:/app/logs
      - backend_media:/app/media
    networks:
      - hrms_network

  # ---------- Celery Beat (Periodic Task Scheduler) ----------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A HRMS beat --loglevel=info
    networks:
      - hrms_network

  # ---------- React Frontend (Nginx) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - hrms_network


# ==============================================================================
# Networks & Volumes
# ==============================================================================

networks:
  hrms_network:
    driver: bridge

volumes:
  redis_data:
  backend_static:
  backend_media:
  backend_logs: